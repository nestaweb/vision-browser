# Vision Browser : application macOS définitive.
# Générer le projet Xcode : xcodegen generate (le .xcodeproj n'est pas versionné).
name: VisionBrowser
options:
  bundleIdPrefix: app.visionbrowser
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  VisionBrowser:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleDisplayName: Vision Browser
        # App en français : les éléments que macOS ajoute aux menus (« Passer en plein écran »…) le sont aussi.
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr]
        CFBundleName: Vision Browser
        # Sans ces deux lignes, XcodeGen écrit « 1.0 » et « 1 » en dur au lieu des réglages de version ci-dessus.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        NSPrincipalClass: NSApplication
        # Un navigateur doit pouvoir afficher les sites sans HTTPS. L'exception ne vaut que pour les pages web
        # (WebKit) : le reste de l'app (CLI Bitwarden, téléchargements internes) reste tenu au HTTPS.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        LSApplicationCategoryType: public.app-category.productivity
        # Sans ces phrases, WebKit cache le micro et la caméra aux pages (navigator.mediaDevices absent) et la dictée
        # des sites (webkitSpeechRecognition) échoue. macOS les montre quand il demande l'autorisation, une fois.
        NSMicrophoneUsageDescription: Les sites que vous ouvrez peuvent vous demander le micro (visio, dictée, messages vocaux).
        NSCameraUsageDescription: Les sites que vous ouvrez peuvent vous demander la caméra (visio, photo de profil).
        NSSpeechRecognitionUsageDescription: Les sites qui proposent la dictée transcrivent votre voix avec la reconnaissance vocale de macOS.
        # Permet à Vision Browser de devenir le navigateur par défaut.
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleURLSchemes: [http, https]
            CFBundleTypeRole: Viewer
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSItemContentTypes: [public.html]
        NSUserActivityTypes: [NSUserActivityTypeBrowsingWeb]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.visionbrowser.browser
        PRODUCT_NAME: Vision Browser
        # Icône : le bonhomme « Scène » (design/logo.svg), générée par scripts/make-icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  VisionBrowserTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: VisionBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.visionbrowser.browser.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Vision Browser.app/Contents/MacOS/Vision Browser"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VisionBrowser:
    build:
      targets:
        VisionBrowser: all
        VisionBrowserTests: [test]
    test:
      targets: [VisionBrowserTests]
